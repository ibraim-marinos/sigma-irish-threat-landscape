name: Validate Sigma Library

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Rules and Repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install sigma-cli==3.1.0

      - name: Display Sigma CLI version
        run: sigma version

      - name: Validate all Sigma rules
        run: sigma check rules

      - name: Run repository quality checks
        run: python tests/validate_repository.py