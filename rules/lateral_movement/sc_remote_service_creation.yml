title: SC.exe Remote Service Creation
id: ba7ff779-9b15-4a4a-8328-80aa0a6609ab
status: experimental
description: Identifies SC.exe commands that create a service on a remote Windows system and configure its executable path.
references:
  - https://attack.mitre.org/techniques/T1569/002/
  - https://attack.mitre.org/detectionstrategies/DET0421/
  - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/sc-create
  - https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon
author: Ibraim Arturo Marinos Lian
date: 2026-07-26
license: MIT
tags:
  - attack.execution
  - attack.t1569.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    - Image|endswith: '\sc.exe'
    - OriginalFileName: sc.exe
  selection_remote:
    CommandLine|contains: '\\'
  selection_create:
    CommandLine|contains: 'create'
  selection_binpath:
    CommandLine|contains: 'binPath='
  condition: selection_image and selection_remote and selection_create and selection_binpath
fields:
  - Image
  - CommandLine
  - ParentImage
  - ParentCommandLine
  - User
  - Computer
  - ProcessId
  - ProcessGuid
  - Hashes
falsepositives:
  - Approved remote software deployment, system administration, configuration management, incident response, or security testing.
level: high