title: Rundll32 Suspicious Script Execution
id: d7a834df-e793-4c49-a321-c7a35002d6e0
status: experimental
description: Identifies Rundll32 command lines that use script protocols together with MSHTML execution indicators.
references:
  - https://attack.mitre.org/techniques/T1218/011/
  - https://attack.mitre.org/detectionstrategies/DET0475/
  - https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon
author: Ibraim Arturo Marinos Lian
date: 2026-07-24
license: MIT
tags:
  - attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    - Image|endswith: '\rundll32.exe'
    - OriginalFileName: RUNDLL32.EXE
  selection_protocol:
    CommandLine|contains:
      - 'javascript:'
      - 'vbscript:'
  selection_mshtml:
    CommandLine|contains:
      - 'mshtml'
      - 'RunHTMLApplication'
  condition: selection_image and selection_protocol and selection_mshtml
fields:
  - Image
  - CommandLine
  - ParentImage
  - ParentCommandLine
  - User
  - Computer
  - ProcessId
  - ProcessGuid
  - Hashes
falsepositives:
  - Approved legacy applications, administrative scripts, or security testing that intentionally uses Rundll32 with MSHTML script execution.
level: high