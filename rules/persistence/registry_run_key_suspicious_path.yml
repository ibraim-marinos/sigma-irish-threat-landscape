title: Registry Run Key Persistence from Suspicious Path
id: a82d4fc1-4d82-4e72-9102-f609b438ecb0
status: experimental
description: Identifies Windows Registry Run or RunOnce values that reference executables or scripts located in user-writable directories.
references:
  - https://attack.mitre.org/techniques/T1547/001/
  - https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon
author: Ibraim Arturo Marinos Lian
date: 2026-07-25
license: MIT
tags:
  - attack.persistence
  - attack.t1547.001
logsource:
  category: registry_set
  product: windows
detection:
  selection_run_key:
    TargetObject|contains:
      - '\Software\Microsoft\Windows\CurrentVersion\Run\'
      - '\Software\Microsoft\Windows\CurrentVersion\RunOnce\'
      - '\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Run\'
      - '\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\RunOnce\'
  selection_suspicious_path:
    Details|contains:
      - '\AppData\'
      - '\Temp\'
      - '\Downloads\'
      - '\Users\Public\'
      - '%APPDATA%'
      - '%TEMP%'
  condition: selection_run_key and selection_suspicious_path
fields:
  - TargetObject
  - Details
  - Image
  - User
  - Computer
  - ProcessId
  - ProcessGuid
falsepositives:
  - Legitimate per-user applications that configure automatic startup from AppData or another user-writable directory.
  - Approved software installation, update, or administrative activity.
level: medium