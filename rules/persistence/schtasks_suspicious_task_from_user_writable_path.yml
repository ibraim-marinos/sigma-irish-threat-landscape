title: Scheduled Task Creation from User-Writable Path
id: fbe93997-3f12-4924-aae0-c0539fd03899
status: experimental
description: Identifies Schtasks creating a scheduled task that executes content from a user-writable directory.
references:
  - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/schtasks-create
  - https://attack.mitre.org/techniques/T1053/005/
author: Ibraim Arturo Marinos Lian
date: 2026-07-25
license: MIT
tags:
  - attack.persistence
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    - Image|endswith: '\schtasks.exe'
    - OriginalFileName: schtasks.exe
  selection_create:
    CommandLine|contains: '/create'
  selection_suspicious_path:
    CommandLine|contains:
      - '\AppData\'
      - '\Temp\'
      - '\Downloads\'
      - '\Users\Public\'
      - '%APPDATA%'
      - '%TEMP%'
  condition: selection_image and selection_create and selection_suspicious_path
fields:
  - Image
  - CommandLine
  - ParentImage
  - ParentCommandLine
  - User
  - Computer
  - ProcessId
  - ProcessGuid
  - Hashes
falsepositives:
  - Legitimate software installation or update processes that create scheduled tasks using per-user application paths.
  - Approved administrative or enterprise automation.
level: medium